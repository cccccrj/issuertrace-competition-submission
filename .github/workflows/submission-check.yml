name: Submission reproducibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Build the real app shell before backend integration/security tests.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: npm ci && npm test && npm run build
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-submission.lock.txt
      - run: python -m unittest discover -s tests -v
