# 机构主数据：出现在事件主体里、但不是被监控上市公司的组织。
#
# 存在的理由，从数据里读出来：`event_elements` 有 1,151 个互不相同的未解析主体，
# 其中 610 个是机构名。同一家机构最多有过四种写法——「中金公司」「中国国际金融
# 股份有限公司」「中金财富」「中国国际金融股份有限公司北京建国门外大街证券营业部」
# 各自成一行，谁也不知道它们是一家。
#
# 这**不是** `sources.yaml` 的 `entities` 的补充名单。两者的命名空间刻意分开：
# `entities` 归一到 `company_id`，是被监控主体；本文件归一到 `org_id`，是**其他人**。
# 药明生物、药明合联、WuXi Biologics 在 `sources.yaml` 里被 `exclude_or_review`
# 明确挡在药明康德之外，因为它们是独立上市主体；把它们收进本文件**不会**改变这一点，
# 只是让它们从「未解析」变成「有名字的第三方」。
#
# 收录门槛：语料中出现 ≥8 次。低于这个数的尾巴很长（1,151 个取值里绝大多数只出现
# 一两次），逐个编名字是在发明词表而不是整理已有事实——与 `root_document_type`
# 保持原样是同一条理由。
#
# `aliases` 只写**整体等同**的写法。分支机构不必列举：证券营业部、总部、分公司这类
# 后缀由 `resolve_organization` 的前缀规则处理，见 `processor/normalize.py`。

