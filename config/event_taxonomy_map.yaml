unmappable_rationale:
  # 公司侧：官方按「业务动作」立目，本系统议题词表按「审核期关注点」立目，
  # 二者在战略与拓展这一片完全不相交。
  # 行业侧：本系统议题词表本就是按公司议题设计的（方案 §8.2），
  # 行业政策与行业景气整体缺位。这是词表覆盖面的结构性缺口，不是分类错误。
  "公共卫生事件": "行业级外部冲击事件，本系统议题词表无对应类目"
