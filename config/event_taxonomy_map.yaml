# 官方事件名 → 本系统受控词表 的冻结映射
#
# 用途：把主办方数据集的 event_name（84 家公司 44 个去重名 + 17 个行业 20 个名，
# 每个名都带长文定义）折算到本系统的两套受控词表上，从而在不做人工标注的前提下
# 计算 E1。映射是交付方的一次性人工归并，是评测中唯一的主观环节，因此必须公开、
# 冻结、并与指标一同呈现。
#
# 两套目标词表的定位不同：
#   issue_codes  —— 26 个议题码（processor/pipeline.py::ISSUE_RULES；v1 时为 22 个，
#                   v2 补入四个见 changelog_v2），粒度与官方体系接近，是 E1 的**主指标**。
#   event_types  —— 12 类命题事件类型（同文件 EVENT_TYPES），是 E1 的**副表**。
#
# 已实测并须随指标申明的事实：两套体系的轴不同。官方按**业务动作**划分（创新、
# 拓展、战略、产能、行业政策），本系统 12 类按**风险类型**划分（处罚、诉讼、审计、
# 股权、召回）。因此 event_types 一侧高度退化——44 个官方名里有 14 个唯一落入
# PRODUCT_TECH_IP，其余大量落入 CUSTOMER_SUPPLIER_OPERATIONS，混淆矩阵接近单列。
# 这不是分类器的错误，是词表覆盖面的事实，报告中作为误差分析的一部分呈现。
#
# 空列表 `[]` 表示**本系统词表没有对应类**。这类金标行进入独立的 unmappable 桶，
# 在报告中单列行数，既不丢弃、也不计为系统错误。每一个 `[]` 都必须在
# unmappable_rationale 中写明理由。

version: 2
frozen_at: "2026-09-03"
supersedes:
  version: 1
  frozen_at: "2026-09-02"
  file_sha256: "511513a7"  # 前 8 位，与 benchmark_runs.map_version 中的 v1+511513a7 对应
dataset: "命题二 事件驱动智能识别可信评估与脉络追踪（主办方发放）"
dataset_sha256:
  事件类型_标的.json: "06d7c747f879913dfd5eb1d8e9356ba7eec8a4449145211c0ebf5742f52eeb4a"
  事件类型_行业.json: "95b66eddf770f903ef48c79bf632a14c75147004149185a22229bc0fe67bf01d"

policy: >
  本映射在计算任何指标之前提交，冻结后不得因指标不佳而修改。任何修改必须提升
  version，并在评测报告中与旧版数字并列呈现；benchmark_runs.map_version 记录
  运行时使用的版本与文件哈希，事后改动在 git 历史中可检测。

changelog_v2: >
  v1 → v2 只做一件事：为 v1 中判为「本系统词表无对应类」的 37 个官方事件名补上类目，
  代价是本系统议题词表从 22 码扩到 26 码（processor/pipeline.py::ISSUE_RULES）。
  **v1 中已有的映射一律未改动**——改已有映射等于用指标反推归并，是冻结政策禁止的；
  因此 "OPEC+产量政策变化" 仍归 CYCLE_PRICE 而非新增的 INDUSTRY_POLICY，尽管后者
  事后看更贴切。这条自我约束的代价写在这里，供复核。

  四个新码而非路线图所说的两个：37 个名实际分成四类，行业侧是「政策」与「景气/产业发展」，
  公司侧是「拓展」与「战略转型」。进入新地盘与重组既有地盘不是同一类事件，合并会造出
  一个分类器无从区分、报告也无从辩护的杂类。

  补完后仍不可映射者只剩 1 个（"公共卫生事件"），理由见 unmappable_rationale。

