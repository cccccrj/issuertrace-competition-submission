    industry: "semiconductor"
    stock_codes:
      - exchange: "SSE STAR"
        code: "688825"
    include_aliases:
      - "长鑫科技集团股份有限公司"
      - "长鑫科技"
      - "长鑫存储"
      - "CXMT"
