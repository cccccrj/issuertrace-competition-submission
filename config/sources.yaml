collection_defaults:
  scheduling:
    campaign_id: "cxmt_competition_gap_v1"
    paused: true
    focus_company: cxmt
    active_source_ids:
      - securities_times
      - shanghai_securities_news
    adapter_jobs_per_source_per_cycle: 6
    drain_discovered_details_first: true
    completion_gate:
      company_id: cxmt
      minimum_valid_documents: 400
      document_types:
        - independent_news
        - hardware_news
        - news_brief
        - market_newsflash
        - company_news
        - company_updates
        - semiconductor_news
        - industry_news
        - press_releases
      stop_daemon: true
    focus_note: "长鑫科技媒体有效文档已达到 400 篇活动门槛并自动停机；配置重新关闭，后续增量恢复前须再次审核。"
  user_agent_policy: "使用可识别的项目 User-Agent，并提供联系邮箱或公开项目问题反馈地址"
  robots_policy: "采集前检查 robots.txt 和网站条款；禁止绕过登录、验证码、访问控制或付费墙"
  raw_preservation: "保存原文、最终 URL、抓取时间、发布时间、标题、作者、正文哈希和页面快照哈希"
  deduplication: "先按规范化 URL 和正文哈希去重，再按标题、事件实体与时间窗口聚类"
  evidence_rule: "S0/S1 可作为原始证据；S2 用于独立交叉验证；S3 仅作线索，必须回溯原文"
  network_routing:
    strategy: source_id_allowlist
    direct_semantics: "显式忽略 HTTP_PROXY、HTTPS_PROXY 和 ALL_PROXY，直接连接目标站点"
    proxy_semantics: "使用运行环境提供的 HTTP_PROXY、HTTPS_PROXY 或 ALL_PROXY；配置文件不保存代理地址和凭据"
    unknown_source_route: proxy
    retry_policy: "同一路由内指数退避；DIRECT 来源不自动切换代理，确需切换时由人工修改配置"
    direct_source_ids:
      - market_quotes
      - cxmt_cn
      - cxmt_en
      - wuxi_cn
      - wuxi_zh_hk
      - sse_announcements
      - cninfo_announcements
      - sse_ipo_review
      - sse_einteractive
      - csrc
      - gsxt
      - credit_china
      - cnipa
      - miit
      - mofcom
      - nmpa
      - local_environment
      - court_documents
      - securities_times
      - china_securities_journal
      - shanghai_securities_news
      - yicai
      - cls
      - nbd
      - twenty_first_finance
      - jiemian
      - ijiwei
      - eet_china
      - chinaflashmarket
      - market_mirrors
      - social_public
    proxy_source_ids:
      - wuxi_en
      - wuxi_ir_materials
      - wuxi_announcements
      - hkex_news_02359
      - congress
      - us_hsgac
      - us_house_oversight
      - us_dod
      - us_bis
      - us_federal_register
      - us_federal_register_api
      - us_fda
      - us_fda_openfda
      - us_govinfo
      - trendforce
      - eetimes
      - reuters
      - fierce_biotech
      - fierce_pharma
      - biospace
      - associated_press
      - toms_hardware
      - courtlistener
      - paid_research_metadata
  proxy_pool_policy:
    gateway: environment_proxy
    endpoint_source: "仅从 HTTP_PROXY、HTTPS_PROXY 或 ALL_PROXY 读取本地网关；禁止将订阅 URL、节点地址或凭据写入仓库和日志"
    upstream_management: "上游节点选择、健康检查和故障切换由本地 Mihomo/兼容网关管理；采集器不得假设订阅节点会自动轮换"
    session_affinity: "同一目标域名、Cookie jar 和登录状态固定出口，建议最短保持 30 分钟"
    rotation_triggers:
      - "网关判定当前上游节点不可达"
      - "连续 3 次连接失败或 TLS 握手失败"
      - "人工确认出口 IP 被目标站点临时阻断"
    forbidden_rotation_triggers:
      - "收到 429、Retry-After 或站点明确限频提示"
      - "出现验证码、JavaScript challenge、登录验证或访问权限提示"
      - "为了突破单站点频率或访问数量限制"
    aggregate_rate_limit: "同一 source_id 的限速按全部代理节点汇总计算，不因更换出口 IP 重置"
    privacy: "不探测、导出或记录订阅内容；日志只记录脱敏后的 route_id 和出口国家/地区（如业务确需）"
  access_control:
    default_profile: conservative
    schedule_jitter_ratio: 0.20
    conditional_requests: true
    respect_retry_after: true
    per_domain_queue: true
    profiles:
      conservative:
        concurrency_per_domain: 1
        min_interval_seconds: 10
        max_requests_per_minute: 6
        request_timeout_seconds: 30
        max_transport_retries: 2
      standard_public:
        concurrency_per_domain: 2
        min_interval_seconds: 3
        max_requests_per_minute: 20
        request_timeout_seconds: 30
        max_transport_retries: 2
      large_documents:
        # Same politeness as conservative -- one request at a time, ten seconds
        # apart, six a minute.  Only the read timeout differs: IPO review filings
        # run to tens of megabytes and at the measured 700 KB/s a 20MB
        # prospectus needs longer than 30 seconds, so the timeout was rejecting
        # documents the publisher was serving perfectly well.
        concurrency_per_domain: 1
        min_interval_seconds: 10
        max_requests_per_minute: 6
        request_timeout_seconds: 180
        max_transport_retries: 2
      sensitive_public:
        concurrency_per_domain: 1
        min_interval_seconds: 30
        max_requests_per_minute: 2
        request_timeout_seconds: 45
        max_transport_retries: 1
      low_volume_api:
        concurrency_per_domain: 1
        min_interval_seconds: 30
        max_requests_per_minute: 2
        request_timeout_seconds: 30
        max_transport_retries: 2
      manual_only:
        concurrency_per_domain: 0
        min_interval_seconds: null
        max_requests_per_minute: 0
        request_timeout_seconds: null
        max_transport_retries: 0
    profile_source_ids:
      standard_public:
        - cxmt_cn
        - cxmt_en
        - wuxi_cn
        - wuxi_en
        - wuxi_zh_hk
        - wuxi_ir_materials
        - wuxi_announcements
        - securities_times
        - china_securities_journal
        - shanghai_securities_news
        - cls
        - nbd
        - twenty_first_finance
        - jiemian
        - ijiwei
        - eet_china
        - chinaflashmarket
        - trendforce
        - eetimes
        - reuters
        - fierce_biotech
        - fierce_pharma
        - biospace
        - associated_press
        - toms_hardware
        - market_mirrors
      conservative:
        - sse_announcements
        - cninfo_announcements
        - hkex_news_02359
        - sse_einteractive
        - csrc
        - congress
        - us_hsgac
        - us_house_oversight
        - us_dod
        - us_bis
        - us_federal_register
        - us_federal_register_api
        - us_fda
        - local_environment
        - courtlistener
      large_documents:
        - sse_ipo_review
      sensitive_public:
        - miit
      low_volume_api:
        - us_fda_openfda
        - us_govinfo
      manual_only:
        - yicai
        - gsxt
        - credit_china
        - cnipa
        - nmpa
        - mofcom
        - court_documents
        - social_public
        - paid_research_metadata
    response_policy:
      "304": "内容未变化，更新检查水位，不重复下载"
      "401": "立即停止该来源并进入人工授权检查"
      "403": "停止自动重试，冷却 24 小时并人工判断是权限、WAF 还是区域限制；不得靠换 IP 连续试探"
      "408": "按 30 秒、120 秒退避，最多重试 2 次"
      "429": "严格遵守 Retry-After；缺失时至少冷却 60 分钟，同一来源全代理池共同冷却"
      "5xx": "按 30 秒、120 秒、600 秒指数退避，达到站点熔断阈值后暂停"
      captcha_or_challenge: "保存最少诊断信息，停止自动访问并创建人工任务；不得接入自动打码或绕过机制"
      login_or_consent_window: "保持同一 Cookie jar 与出口 IP；验证过期后进入人工刷新，不并发创建新会话"
    circuit_breaker:
      consecutive_failures: 5
      rolling_window_minutes: 15
      initial_cooldown_minutes: 60
      max_cooldown_hours: 24
      half_open_probe_requests: 1
    adaptive_tuning: "只有在网站条款、robots、响应头和连续运行指标允许时才提高频率；默认配置是上限，不是必须跑满的目标"

